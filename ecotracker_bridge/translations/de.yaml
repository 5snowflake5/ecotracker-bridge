configuration:
  source_url:
    name: EcoTracker-Adresse
    description: IP oder URL des physischen EcoTrackers, ohne /v1/json
  idle_fetch_seconds:
    name: Idle-Fetch
    description: "Selbst holen, wenn so viele Sekunden kein /v1/json (NOAH) kam. 0 = aus. Default 5."
  log_level:
    name: Log-Level
    description: info = ruhig, debug = jeden GET inkl. Intervall Δ
  mqtt_enabled:
    name: MQTT-Sensoren
    description: Sensoren per Home Assistant MQTT Discovery anlegen (Mosquitto nötig)
  mqtt_host:
    name: MQTT-Host
    description: Meist core-mosquitto
  mqtt_port:
    name: MQTT-Port
    description: "1883"
  mqtt_user:
    name: MQTT-User
    description: Leer lassen, wenn der Broker ohne Login erlaubt
  mqtt_password:
    name: MQTT-Passwort
    description: Optional
  mqtt_discovery_prefix:
    name: Discovery-Prefix
    description: homeassistant
  port:
    name: HTTP-Port
    description: Growatt NOAH erwartet 80
  mac:
    name: MAC
    description: Feste 12-stellige Hex-MAC für Hostname ecotracker-<mac>. Nicht ändern nach dem Koppeln.
  serial:
    name: Serial
    description: mDNS-TXT serial (Default wie uni-meter)
  productid:
    name: Product ID
    description: "1137 = EcoTracker IR"
  announce_ip:
    name: Angekündigte IP
    description: Leer lassen für Auto-Erkennung. Nur setzen, wenn der Pi mehrere IPs hat.
  shelly_enabled:
    name: Shelly Pro 3EM
    description: Zweiten virtuellen Zähler (Gen2 RPC /rpc + mDNS _shelly._tcp) parallel bereitstellen. Gleiche Messwerte wie EcoTracker.
  shelly_mac:
    name: Shelly-MAC
    description: Feste 12-stellige Hex-MAC für Hostname shellypro3em-<mac>. Nicht ändern nach dem Koppeln.
network:
  80/tcp: HTTP EcoTracker JSON und Shelly RPC für Growatt NOAH
