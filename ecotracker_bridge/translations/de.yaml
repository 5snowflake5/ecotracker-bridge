configuration:
  source_url:
    name: EcoTracker-Adresse
    description: IP oder URL des physischen EcoTrackers, ohne /v1/json
  idle_fetch_seconds:
    name: Idle-Fetch
    description: "Selbst holen, wenn so viele Sekunden kein /v1/json (NOAH) kam. 0 = aus. Default 5."
  log_level:
    name: Log-Level
    description: info = ruhig, debug = jeden GET inkl. Intervall Δ
  port:
    name: HTTP-Port
    description: Growatt NOAH erwartet 80
  mac:
    name: MAC
    description: Feste 12-stellige Hex-MAC für Hostname ecotracker-<mac>. Nicht ändern nach dem Koppeln.
  serial:
    name: Serial
    description: mDNS-TXT serial (Default wie uni-meter)
  productid:
    name: Product ID
    description: "1137 = EcoTracker IR"
  announce_ip:
    name: Angekündigte IP
    description: Leer lassen für Auto-Erkennung. Nur setzen, wenn der Pi mehrere IPs hat.
network:
  80/tcp: HTTP und JSON für Growatt NOAH
