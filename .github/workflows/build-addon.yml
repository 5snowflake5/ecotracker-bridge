name: Build add-on images

on:
  push:
    branches: [master]
    paths:
      - "ecotracker_bridge/**"
      - "growatt_cloud/**"
      - ".github/workflows/build-addon.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon: ecotracker_bridge
            arch: aarch64
            platform: linux/arm64
          - addon: ecotracker_bridge
            arch: amd64
            platform: linux/amd64
          - addon: growatt_cloud
            arch: aarch64
            platform: linux/arm64
          - addon: growatt_cloud
            arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          v=$(sed -n 's/^version: "\(.*\)"/\1/p' ${{ matrix.addon }}/config.yaml | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.addon }} $v for ${{ matrix.arch }}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.addon }}
          file: ./${{ matrix.addon }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ghcr.io/5snowflake5/${{ matrix.arch }}-addon-${{ matrix.addon }}:${{ steps.ver.outputs.version }}
            ghcr.io/5snowflake5/${{ matrix.arch }}-addon-${{ matrix.addon }}:latest
