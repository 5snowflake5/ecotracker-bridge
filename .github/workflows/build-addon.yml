name: Build add-on images (edge)

# Nur Preview-Tags. HA-Updates kommen erst nach "Release add-on"
# (Image zuerst auf GHCR, danach Versionsbump in config.yaml).

on:
  push:
    branches: [master, main]
    paths:
      - "ecotracker_bridge/**"
      - ".github/workflows/build-addon.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Edge tag
        id: ver
        run: |
          sha="${GITHUB_SHA::7}"
          echo "tag=edge" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$sha" >> "$GITHUB_OUTPUT"
          echo "Building ecotracker_bridge edge ($sha) for ${{ matrix.arch }}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./ecotracker_bridge
          file: ./ecotracker_bridge/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ghcr.io/5snowflake5/${{ matrix.arch }}-addon-ecotracker_bridge:${{ steps.ver.outputs.tag }}
            ghcr.io/5snowflake5/${{ matrix.arch }}-addon-ecotracker_bridge:${{ steps.ver.outputs.sha_tag }}
