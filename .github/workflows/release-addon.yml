name: Release add-on

# Reihenfolge absichtlich:
# 1) Image mit neuer Version nach GHCR pushen
# 2) Erst bei Erfolg version in config.yaml committen
# → Home Assistant zeigt „Update“ erst, wenn der Pull klappt.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Neue Version (z.B. 1.3.2)"
        required: true
        type: string
      changelog:
        description: "Kurzer Changelog-Hinweis (optional, nur Log)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-addon-ecotracker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Prepare version in build tree
        id: ver
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          V="${V#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ungültige Version: $V (erwartet x.y.z)"
            exit 1
          fi
          CUR=$(sed -n 's/^version: "\(.*\)"/\1/p' ecotracker_bridge/config.yaml | head -1)
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release $CUR → $V (${{ matrix.arch }})"
          sed -i "s/^version: \".*\"/version: \"$V\"/" ecotracker_bridge/config.yaml
          sed -i "s/^VERSION = \".*\"/VERSION = \"$V\"/" ecotracker_bridge/bridge.py

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./ecotracker_bridge
          file: ./ecotracker_bridge/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ghcr.io/5snowflake5/${{ matrix.arch }}-addon-ecotracker_bridge:${{ steps.ver.outputs.version }}
            ghcr.io/5snowflake5/${{ matrix.arch }}-addon-ecotracker_bridge:latest

  publish-version:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version in git (HA Store sieht das erst jetzt)
        env:
          V: ${{ inputs.version }}
          NOTE: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          V="${V#v}"
          CUR=$(sed -n 's/^version: "\(.*\)"/\1/p' ecotracker_bridge/config.yaml | head -1)
          if [[ "$CUR" == "$V" ]]; then
            echo "config.yaml ist bereits $V – nichts zu committen (Image wurde neu gebaut)."
            exit 0
          fi
          sed -i "s/^version: \".*\"/version: \"$V\"/" ecotracker_bridge/config.yaml
          sed -i "s/^VERSION = \".*\"/VERSION = \"$V\"/" ecotracker_bridge/bridge.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ecotracker_bridge/config.yaml ecotracker_bridge/bridge.py
          MSG="Release $V (image published first)."
          if [[ -n "${NOTE// }" ]]; then
            MSG="$MSG $NOTE"
          fi
          git commit -m "$MSG"
          git push origin HEAD:master
          echo "HA Store: Update $CUR → $V ist jetzt sichtbar, Image existiert bereits."
